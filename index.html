<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="title">Thiết kế vị trí cột và anten</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            padding: 1rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            gap: 2rem;
        }
        .control-panel, .map-container {
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .language-switch {
            position: absolute;
            right: 20px;
            top: 20px;
        }
        select {
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #ccc;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4b5563;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background-color: #3b82f6;
            color: #fff;
            font-weight: 700;
            border-radius: 0.5rem;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        #map {
            height: 100%;
            width: 100%;
            border-radius: 0.75rem;
        }
        .info-panel {
            background-color: #e5e7eb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            color: #1f2937;
        }

        .map-container {
            height: 60vh;
        }

        .tab-button {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            background-color: #e5e7eb;
            font-weight: 600;
            color: #4b5563;
        }
        .tab-button.active {
            background-color: #3b82f6;
            color: #fff;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        @media (min-width: 1024px) {
            .container {
                display: flex;
                flex-direction: row;
                min-height: 90vh;
            }
            .control-panel { flex: 1; }
            .map-container { flex: 3; height: auto; }
        }
    </style>
</head>

<body>

<!-- Bộ chọn ngôn ngữ -->
<div class="language-switch">
    <select id="languageSelect" onchange="changeLanguage()">
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="en">🇬🇧 English</option>
        <option value="pt">🇵🇹 Português</option>
    </select>
</div>


<div class="container flex flex-col lg:flex-row">

    <div class="control-panel">

        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800" data-lang="header">
            Thiết kế vị trí cột và anten
        </h1>

        <!-- Tabs -->
        <div class="flex border-b border-gray-300 mb-4">
            <button class="tab-button active rounded-t-lg"
                    onclick="openTab('tab1')" data-lang="tab1">
                Thiết kế móng cột
            </button>

            <button class="tab-button rounded-t-lg"
                    onclick="openTab('tab2')" data-lang="tab2">
                Thiết kế anten
            </button>
        </div>

        <!-- TAB 1 -->
        <div id="tab1" class="tab-content active">

            <div class="form-group">
                <label data-lang="lat">Tọa độ tâm cột (Vĩ độ):</label>
                <input type="text" id="lat1" value="-25.744104">
            </div>

            <div class="form-group">
                <label data-lang="lng">Tọa độ tâm cột (Kinh độ):</label>
                <input type="text" id="lng1" value="32.671572">
            </div>

            <div class="form-group">
                <label data-lang="towerType">Loại cột:</label>
                <select id="loaiCot">
                    <option value="day_co" data-lang="guyed">Dây co</option>
                    <option value="tu_dung" data-lang="self">Tự đứng</option>
                </select>
            </div>

            <div class="form-group">
                <label data-lang="gateAzimuth">Hướng cửa trạm (góc Azimuth):</label>
                <input type="number" id="huongCuaTram" value="0" min="0" max="360">
            </div>

            <div class="form-group">
                <label data-lang="fence">Kích thước hàng rào (rộng x dài):</label>
                <div class="flex gap-2">
                    <input type="number" id="kichThuocHangRaoRong" value="6" min="1" step="0.1">
                    <input type="number" id="kichThuocHangRaoDai" value="8" min="1" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label data-lang="anchors">Số móng co:</label>
                <select id="soMongCo">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="form-group">
                <label data-lang="height">Độ cao cột (m):</label>
                <input type="number" id="doCaoCot" value="60.5" step="0.1">
            </div>

            <button class="btn" onclick="veBanDoCot()" data-lang="drawMap1">
                Vẽ bản đồ
            </button>

            <div id="infoPanel1" class="info-panel"></div>
        </div>


        <!-- TAB 2 -->
        <div id="tab2" class="tab-content">

            <div class="form-group">
                <label data-lang="lat">Tọa độ tâm cột (Vĩ độ):</label>
                <input type="text" id="lat2" value="-25.744104">
            </div>

            <div class="form-group">
                <label data-lang="lng">Tọa độ tâm cột (Kinh độ):</label>
                <input type="text" id="lng2" value="32.671572">
            </div>

            <div class="form-group">
                <label data-lang="antenCount">Số lượng anten:</label>
                <input type="number" id="soAnten" value="3" min="1">
            </div>

            <div id="anten-fields"></div>

            <button class="btn mt-4" onclick="addAntenFields()" data-lang="addAnten">
                Thêm anten
            </button>

            <button class="btn mt-4" onclick="veBanDoAnten()" data-lang="drawMap2">
                Vẽ bản đồ
            </button>

            <div id="infoPanel2" class="info-panel"></div>
        </div>

    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>

</div>

<!-- Script -->
<script src="config.js" type="text/javascript"></script>
<script src="lang.js" type="text/javascript"></script>
<script src="script.js" type="text/javascript"></script>

</body>
</html>
